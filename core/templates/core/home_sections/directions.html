{% load i18n %}
<section id="directions" class="section bg-color-grey border-0 m-0 py-5">
    <div class="container py-lg-3">
        <p class="text-color-primary font-weight-semibold text-3 mb-2">{{ section.i18n.eyebrow }}</p>
        <h2 class="text-color-dark font-weight-bold text-8 line-height-3 text-transform-none mb-4">{{ section.i18n.title }}</h2>
        <div class="row g-4">
            {% for direction in home_directions %}
            <div class="col-md-6 col-xl-3">
                <article class="card h-100 border-0"><div class="card-body p-4">
                    <i class="fas fa-{{ direction.icon }} text-color-primary text-8 mb-4" aria-hidden="true"></i>
                    <h3 class="text-color-dark text-5 font-weight-bold text-transform-none mb-3">{{ direction.i18n.title }}</h3>
                    <p class="text-4 line-height-7 mb-0">{{ direction.i18n.description }}</p>
                </div></article>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
