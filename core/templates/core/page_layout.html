{% extends 'core/base.html' %}
{% load i18n %}

{% block title %}{{ page_title }} — {{ site_settings.i18n.name }}{% endblock %}

{% block content %}
<section class="page-header page-header-modern bg-color-light-scale-1 py-3 mb-0">
    <div class="container">
        <div class="row align-items-center gy-2">
            <div class="col-12">
                <h1 class="text-color-light font-weight-bold text-6 text-sm-7 line-height-3 mb-0">{{ page_title }}</h1>
            </div>
        </div>
    </div>
</section>
<div class="container page-content py-5">
    {% block page_content %}{% endblock %}
</div>
{% endblock %}
